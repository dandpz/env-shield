[package]
name = "env-shield"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Encrypted local vault that replaces plaintext .env files"
license = "MIT"
repository = "https://github.com/dandpz/env-shield"
keywords = ["env", "secrets", "vault", "dotenv", "encryption"]
categories = ["command-line-utilities", "cryptography"]
# Keep the published package to what `cargo install` needs.
include = ["src/**", "LICENSE", "README.md"]

# Installed command is `evs` (Env Vault Shield); the crate keeps its full name.
[[bin]]
name = "evs"
path = "src/main.rs"

# `cargo binstall env-shield` — must match the archive layout produced by
# the Package step in .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
rust-2018-idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Doc-comment lints are overkill for a binary crate's internal modules.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
strip = true
codegen-units = 1
